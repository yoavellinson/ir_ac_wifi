esphome:
  name: tcl-ac

esp32:
  board: esp32dev

logger:
api:
ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # ESP32 WiFi power saving makes the device drop off Home Assistant.
  power_save_mode: none
  # Fallback hotspot if the configured network can't be joined; connect to it
  # and open 192.168.4.1 to enter new WiFi credentials.
  ap:
    ssid: "TCL-AC Fallback"

captive_portal:

# Local control/test page at http://tcl-ac.local
web_server:
  port: 80

# GPIO21 must be HIGH to power the IR LED/receiver (per forum report on a
# near-identical board; verify on this revision)
switch:
  - platform: gpio
    id: ir_power
    pin: GPIO21
    restore_mode: ALWAYS_ON
    internal: true

remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 50%

remote_receiver:
  id: ir_rx
  pin:
    number: GPIO14
    inverted: true
    # Keep the line from floating (a floating pin decodes as constant noise)
    mode:
      input: true
      pullup: true
  # Ignore pulses shorter than this, and end a frame after this much silence;
  # together they drop most ambient-light noise.
  filter: 250us
  idle: 10ms
  tolerance: 25%
  dump: all

climate:
  - platform: tcl112
    name: "TCL AC"
    # Update the state when the original remote is used
    receiver_id: ir_rx
