esphome:
  name: tcl-ac

esp32:
  board: esp32dev

logger:
api:
ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback hotspot if the configured network can't be joined; connect to it
  # and open 192.168.4.1 to enter new WiFi credentials.
  ap:
    ssid: "TCL-AC Fallback"

captive_portal:

# Local control/test page at http://tcl-ac.local
web_server:
  port: 80

# GPIO21 must be HIGH to power the IR LED/receiver (per forum report on a
# near-identical board; verify on this revision)
switch:
  - platform: gpio
    id: ir_power
    pin: GPIO21
    restore_mode: ALWAYS_ON
    internal: true

remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 50%

remote_receiver:
  pin:
    number: GPIO14
    inverted: true
  dump: all

climate:
  - platform: tcl112
    name: "TCL AC"
